# TODO https://github.com/microsoft/typespec-mcp
# TODO make a TypeSpec UI tool that walks the typespec config and allows toggling on/off the output
# ZDK: ODK under the hood, but no programming required. Just someone using english.

output-dir: "{project-root}/generated"
emit:
  # ================================
  # base emitters
  # ================================
  # TODO emit GraphQL: https://github.com/microsoft/typespec/issues/4933
  # https://typespec.io/docs/emitters/json-schema/reference
  - "@typespec/json-schema"
  # https://typespec.io/docs/emitters/openapi3/reference
  - "@typespec/openapi3"
  # https://typespec.io/docs/emitters/protobuf/reference
  - "@typespec/protobuf"

  # ================================
  # programming language SDK clients
  # ================================
  # - "@typespec/http-client-js"

  # ================================
  # database schema generators
  # ================================
  - "@omnidotdev/typespec-drizzle"

options:
  "@typespec/json-schema":
    emitter-output-dir: "{output-dir}/schema/json-schema"
    emitAllModels: true
    emitAllRefs: true
    # file-type: "json"
  "@typespec/openapi3":
    emitter-output-dir: "{output-dir}/schema/openapi3"
    openapi-versions:
      - "3.1.0"
  "@typespec/protobuf":
    emitter-output-dir: "{output-dir}/schema/protobuf"
  # "@typespec/http-client-js":
  # emitter-output-dir: "{output-dir}/clients/http-client-js"
  "@omnidotdev/typespec-drizzle":
    outputDir: "{output-dir}/db"
    schemaFile: "schema.ts"
    relationsFile: "relations.ts"
    generateTypes: true
