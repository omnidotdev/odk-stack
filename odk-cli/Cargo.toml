[package]
name = "odk-cli"
version = "0.1.0"
edition = "2024"
description = "ODK CLI - Unified schema compilation from TypeScript, WASM, or JSON to multiple targets"
license = "MIT"

[[bin]]
name = "odk"
path = "src/main.rs"

[dependencies]
# Schema types
odk-schema = { path = "../odk-schema" }

# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"

# Extism for WASM plugin hosting
extism = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# File handling
camino = { version = "1.1", features = ["serde1"] }
tempfile = "3.5"

# Process execution
which = "7"
