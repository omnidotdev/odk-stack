[project]
name = "odk-pdk"
version = "0.1.0"
description = "ODK Plugin Development Kit for Python - Define schemas, compile to WASM"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Omni", email = "dev@omni.dev" }]
keywords = ["odk", "schema", "wasm", "extism", "typespec", "openapi", "protobuf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = []

[project.optional-dependencies]
wasm = ["extism-pdk>=1.0.0"]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odk_pdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
