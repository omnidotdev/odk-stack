[package]
name = "odk-pdk"
version = "0.1.0"
edition = "2024"
description = "ODK Plugin Development Kit for Rust - build WASM schema plugins"
license = "MIT"

[dependencies]
# Extism PDK for WASM plugins
extism-pdk = "1.0"

# Schema types (shared with host)
odk-schema = { path = "../odk-schema" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
