[package]
name = "blog-plugin-rust"
version = "0.1.0"
edition = "2021"
description = "Blog API schema as an ODK WASM plugin"

[lib]
crate-type = ["cdylib"]

[dependencies]
odk-pdk = { path = "../../odk-pdk-rust" }
extism-pdk = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
