# Blog API Schema - YAML Format
#
# This example demonstrates defining a blog API schema using ODK's YAML format.
# Compile with: odk compile blog.odk.yaml -o generated/

version: "1.0"
name: BlogAPI
imports:
  - "@typespec/http"

models:
  User:
    description: A blog user account
    fields:
      id:
        type: string
        format: uuid
        description: Unique user identifier
      email:
        type: string
        format: email
        description: User's email address
      username:
        type: string
        constraints:
          minLength: 3
          maxLength: 32
          pattern: "^[a-zA-Z0-9_]+$"
        description: Unique username
      displayName:
        type: string
        optional: true
        constraints:
          maxLength: 100
        description: Display name shown on posts
      role:
        type: UserRole
        description: User's permission level
      createdAt:
        type: utcDateTime
      updatedAt:
        type: utcDateTime

  Post:
    description: A blog post
    fields:
      id:
        type: string
        format: uuid
      title:
        type: string
        constraints:
          minLength: 1
          maxLength: 200
        description: Post title
      slug:
        type: string
        constraints:
          pattern: "^[a-z0-9-]+$"
        description: URL-friendly slug
      content:
        type: string
        description: Post content in Markdown
      excerpt:
        type: string
        optional: true
        constraints:
          maxLength: 500
        description: Short excerpt for previews
      authorId:
        type: string
        format: uuid
      status:
        type: PostStatus
      publishedAt:
        type: utcDateTime
        optional: true
      createdAt:
        type: utcDateTime
      updatedAt:
        type: utcDateTime

  Comment:
    description: A comment on a post
    fields:
      id:
        type: string
        format: uuid
      content:
        type: string
        constraints:
          minLength: 1
          maxLength: 2000
      postId:
        type: string
        format: uuid
      authorId:
        type: string
        format: uuid
      parentId:
        type: string
        format: uuid
        optional: true
        description: Parent comment ID for nested replies
      createdAt:
        type: utcDateTime

  Tag:
    description: A tag for categorizing posts
    fields:
      id:
        type: string
        format: uuid
      name:
        type: string
        constraints:
          minLength: 1
          maxLength: 50
      slug:
        type: string
        constraints:
          pattern: "^[a-z0-9-]+$"

unions:
  UserRole:
    description: User permission levels
    variants:
      - admin
      - author
      - reader

  PostStatus:
    description: Publication status of a post
    variants:
      - draft
      - published
      - archived

raw: |
  @route("/api")
  @tag("Blog API")
  namespace BlogApiRoutes {
    @route("/posts")
    interface Posts {
      @get list(@query status?: PostStatus): Post[];
      @get read(@path slug: string): Post;
      @post create(@body post: Post): Post;
      @put update(@path id: string, @body post: Post): Post;
      @delete remove(@path id: string): void;
    }

    @route("/users")
    interface Users {
      @get list(): User[];
      @get read(@path id: string): User;
      @post create(@body user: User): User;
    }

    @route("/posts/{postId}/comments")
    interface Comments {
      @get list(@path postId: string): Comment[];
      @post create(@path postId: string, @body comment: Comment): Comment;
    }
  }
